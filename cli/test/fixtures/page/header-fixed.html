<!doctype html><html><head><meta charset="utf-8"><title>header — fixed px</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif}
  /* THE REPORTED BUG: a 1920 design copied out as absolute pixels.
     The search keeps its hard-coded 920px width while the actions are pinned to the
     right edge. At 1920 it looks correct; as the window narrows the actions slide left
     and land ON TOP OF the search bar. */
  #header{position:relative;width:100%;height:72px;background:#0C2380}
  #logo   {position:absolute;left:64px; top:20px;width:140px;height:32px;background:#fff}
  #search {position:absolute;left:620px;top:16px;width:920px;height:40px;background:#eef}
  #actions{position:absolute;right:64px;top:20px;width:256px;height:32px;background:#ffd}
</style></head><body>
<header id="header" data-testid="header">
  <div id="logo"    data-testid="logo"></div>
  <div id="search"  data-testid="search"></div>
  <div id="actions" data-testid="actions"></div>
</header>
</body></html>
